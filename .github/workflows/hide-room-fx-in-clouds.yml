name: Hide room FX in clouds

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hide-room-fx-in-clouds.yml'
      - '.github/patches/hide_room_fx_in_clouds.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch scene
        run: python3 .github/patches/hide_room_fx_in_clouds.py
      - name: Check JavaScript syntax
        run: node --check scene.js
      - name: Commit FX cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scene.js index.html
          git commit -m "Disable room screen effects in cloud world"
          git push origin main
