name: Patch liminal corridor world

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-liminal-world.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply liminal world patch
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > /tmp/patch_liminal.py
          python3 /tmp/patch_liminal.py

      - name: Validate JavaScript syntax
        shell: bash
        run: node --check --input-type=module < scene.js

      - name: Commit changes and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-liminal-world.yml
          git add scene.js index.html styles.css
          git commit -m "Add interactive liminal corridor game section"
          git push origin main
