name: Replace liminal door with curtains

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/replace-liminal-door-with-curtains.yml'

permissions:
  contents: write

jobs:
  patch-scene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace door with curtain gate
        run: python3 .github/patches/curtain_gate.py

      - name: Check JavaScript syntax
        run: node --check scene.js

      - name: Commit curtain gate
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scene.js index.html
          git commit -m "Replace liminal door with self-closing curtains"
          git push origin main
