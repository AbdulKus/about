name: Add cloud exit world

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-cloud-exit-world.yml'
      - '.github/patches/add_cloud_exit_world.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch scene
        run: python3 .github/patches/add_cloud_exit_world.py
      - name: Check JavaScript syntax
        run: node --check scene.js
      - name: Commit cloud exit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scene.js index.html
          git commit -m "Add stable stair exit into moving cloud world"
          git push origin main
