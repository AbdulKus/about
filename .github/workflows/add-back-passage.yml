name: Add rear passage

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-back-passage.yml'

permissions:
  contents: write

jobs:
  patch-scene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch scene
        run: echo '' | base64 -d | python3

      - name: Commit scene update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scene.js
          if git diff --cached --quiet; then
            echo "No scene changes needed"
            exit 0
          fi
          git commit -m "Add long rear passage with distant lamp"
          git push origin main
