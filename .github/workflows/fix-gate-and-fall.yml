name: Fix gate and fall

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-gate-and-fall.yml'
      - '.github/patches/fix_gate_and_fall.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch scene
        run: python3 .github/patches/fix_gate_and_fall.py
      - name: Check JavaScript syntax
        run: node --check scene.js
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scene.js index.html
          git commit -m "Fill curtain gate and move tunnel fall to last lamp"
          git push origin main
