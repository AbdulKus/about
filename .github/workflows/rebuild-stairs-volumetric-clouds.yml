name: Rebuild stairs and volumetric clouds

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebuild-stairs-volumetric-clouds.yml'
      - '.github/patches/rebuild_stairs_volumetric_clouds.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch scene
        run: python3 .github/patches/rebuild_stairs_volumetric_clouds.py
      - name: Check JavaScript syntax
        run: node --check scene.js
      - name: Commit rebuild
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scene.js index.html
          git commit -m "Rebuild staircase and volumetric cloud shader"
          git push origin main
