name: Room style left curtains

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/room-style-left-curtains.yml'
      - '.github/patches/room_style_left_curtains.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch scene
        run: python3 .github/patches/room_style_left_curtains.py
      - name: Check JavaScript syntax
        run: node --check scene.js
      - name: Commit curtains
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scene.js index.html
          git commit -m "Match left corridor curtains to main room"
          git push origin main
